<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forme du jour</title>
  <meta name="theme-color" content="#121211">
  <meta name="description" content="Ton point de forme quotidien à partir de Strava et COROS.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo"></span>Forme du jour</div>
    <button class="icon-btn" id="refresh" title="Actualiser" aria-label="Actualiser" hidden>↻</button>
  </header>
  <main id="app"><p class="loading">Chargement…</p></main>
  <nav class="tabs" id="tabs" hidden>
    <button data-view="today" class="on"><span>●</span>Aujourd'hui</button>
    <button data-view="dash"><span>▤</span>Tableaux</button>
    <button data-view="goal"><span>◎</span>Objectif</button>
    <button data-view="settings"><span>⚙</span>Réglages</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
